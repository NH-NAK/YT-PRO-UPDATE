<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="botGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66" />
      <stop offset="100%" stop-color="#00ffff" />
    </linearGradient>
  </defs>
  <!-- Cyber outer ring -->
  <circle cx="24" cy="24" r="20" fill="none" stroke="url(#botGlow)" stroke-width="2" stroke-dasharray="4,4" />
  <!-- Robot Head Outline -->
  <rect x="14" y="18" width="20" height="16" rx="4" fill="none" stroke="url(#botGlow)" stroke-width="2" />
  <!-- Antenna -->
  <line x1="24" y1="18" x2="24" y2="12" stroke="url(#botGlow)" stroke-width="2" />
  <circle cx="24" cy="11" r="2" fill="url(#botGlow)" />
  <!-- Eyes -->
  <circle cx="20" cy="25" r="2" fill="url(#botGlow)" />
  <circle cx="28" cy="25" r="2" fill="url(#botGlow)" />
  <!-- Mouth -->
  <line x1="19" y1="30" x2="29" y2="30" stroke="url(#botGlow)" stroke-width="2" />
  <!-- Ears -->
  <rect x="11" y="23" width="3" height="6" rx="1" fill="url(#botGlow)" />
  <rect x="34" y="23" width="3" height="6" rx="1" fill="url(#botGlow)" />
</svg>
