<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Magnifying glass / scan radar circle -->
  <circle cx="20" cy="20" r="10" fill="none" stroke="#12131a" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Scan lines inside glass -->
  <line x1="15" y1="20" x2="25" y2="20" stroke="#12131a" stroke-width="2" stroke-opacity="0.8"/>
  <line x1="20" y1="15" x2="20" y2="25" stroke="#12131a" stroke-width="2" stroke-opacity="0.8"/>
  <!-- Handle -->
  <line x1="27" y1="27" x2="38" y2="38" stroke="#12131a" stroke-width="5" stroke-linecap="round"/>
  <!-- Code dots on the side -->
  <circle cx="36" cy="16" r="2.5" fill="#12131a"/>
  <circle cx="40" cy="22" r="2" fill="#12131a"/>
  <circle cx="34" cy="28" r="3" fill="#12131a"/>
</svg>
